grid_drive:
  ros__parameters:
    image_topic: image_raw
    # 도로 (내 차선) YOLO26n-seg 엔진 (젯슨에서 만든 것, 2026-10-28 road_r2 320 FP16 2.96ms). 없으면 색 방식만
    engine_path: ~/yolo26_check/road_r2_320_fp16.engine
    use_road: true
    road_conf: 0.5
    road_mask_thr: 0.5
    # true 면 control_mode 없이 바로 주행 (task_planner 없이 시험). GUI STOP 이면 멈춤
    autostart: false
    # 실제 속도 = cmd_vel x 2.45 (펌웨어 WHEEL_RADIUS_M 0.05, 벨트 비) -> 계획기 v/w (실제) 에 0.05/0.1225 를 곱해 보냄
    cmd_scale: 0.408
    process_rate: 15.0      # [Hz] 0 이하 = 매 프레임
    image_timeout: 0.5      # [s]
    turn_hold_sec: 6.0      # LEFT/RIGHT 표지판을 본 뒤 그쪽 목표 가점 유지
    sign_min_conf: 0.6
    debug_jpeg_quality: 70
    planner:
      linear: 0.10          # [m/s 실제] (cmd_scale 로 나눠 보냄)
      min_linear: 0.04
      max_angular: 1.5
      pivot_angular: 0.6
      soft_speed_ratio: 0.5
      follow_mm: 250.0
      robot_half_width_mm: 100.0
      line_margin_mm: 10.0
      box_margin_mm: 30.0
      map_y_scale: 1.0
      road_min_ratio: 0.05
      memory: false
