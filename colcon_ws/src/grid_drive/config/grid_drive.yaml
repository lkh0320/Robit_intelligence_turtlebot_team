grid_drive:
  ros__parameters:
    # ===== 입력 =====
    image_topic: image_raw          # 카메라 영상 토픽

    # ===== 도로 인식 (YOLO 도로 분할) =====
    engine_path: ~/yolo26_check/road_r2_320_fp16.engine   # 도로 분할 모델 파일. 없으면 색으로만 선을 찾음
    use_road: true                  # true = 모델로 "내 차선" 영역도 같이 씀
    road_conf: 0.5                  # 도로라고 믿는 최소 확신도 (0~1). 도로를 놓치면 낮추기
    road_mask_thr: 0.5              # 도로 칸을 칠하는 기준 (0~1). 선 밖까지 칠해지면 올리기
    barrier_hold_sec: 1.5           # [s] 비전이 닫힌 차단바를 이 시간 안에 봤으면 막다른 길을 차단바로 (dead_end_stop_mm, 직진 없음). 차단바 앞에서 서면 이만큼 안 보여야 (올라가야) 출발
    dead_end_creep_linear: 0.05     # [m/s] 차단바 / 코스 끝이 화면 아래로 빠진 뒤 정지 거리까지 남은 만큼 직진하는 속도 (0 = 안 함)
    road_hold_sec: 0.3              # [s] 도로 / 경로를 이 시간 이하로 놓치면 직전 명령 유지 (30fps 로 약 4 프레임). 0 = 바로 정지
    road_only: true                 # 경로는 주행 가능 구역 (초록) 안에서만. 초록이 없으면 계획 안 하고 정지

    # ===== 시작 / 속도 변환 =====
    autostart: false                # true = task_planner 없이 바로 주행. GUI STOP 이면 멈춤
    cmd_scale: 0.408                # 실제 속도 = cmd_vel x 2.45 (벨트 비). 건드리지 말기

    # ===== 처리 주기 / 안전 =====
    process_rate: 0.0              # [Hz] 1초에 몇 번 계산할지. 0 이하 = 매 프레임
    image_timeout: 0.5              # [s] 영상이 이 시간 넘게 안 오면 멈춤

    # ===== 갈림길 표지판 =====
    turn_hold_sec: 1.0              # [s] 왼쪽/오른쪽 표지판을 본 뒤 그쪽 길을 우선하는 시간
    turn_linear: 0.30               # [m/s] 좌/우 기억 중 속도 (0 = 감속 안 함, 직선은 planner.linear)
    turn_memory: true               # 좌/우 기억 중 odom 기억 켬 (안쪽 선이 화면 밖으로 빠져도 안 넘게)
    turn_line_margin_mm: 0.0        # [mm] 좌/우 기억 중 선 여유 (planner.line_margin_mm 대신). 진입 때 우회전 쪽 빨간 띠가 길을 막으면 낮추기 (음수 가능)
    turn_line_margin_left_mm: 25.0  # [mm] 왼쪽 표지판 진입 때 선 여유 (위 값은 오른쪽). 왼쪽 코너 안쪽 밟으면 올리기, 왼쪽 길로 못 들어가면 낮추기
    turn_line_margin_sec: 1.0       # [s] 위 여유는 표지판을 마지막으로 본 뒤 이 시간만 (진입). 그 뒤 U턴은 planner.line_margin_mm. U턴 안쪽 밟으면 낮추기, 진입 못 하면 올리기 (0 = 내내)
    turn_after_margin_mm: 40.0      # [mm] 진입 뒤 좌/우 기억 중 선 여유 (U턴). 안쪽 선 밟으면 올리기, 바깥 선 밟거나 경로 못 찾으면 낮추기
    turn_memory_max_frames: 0      # 좌/우 기억 중 선 기억 프레임 수 (30fps 45 = 1.5초, 0 = planner.memory_max_frames). U턴 안쪽 선이 화면 밖으로 빠져도 기억. 선이 두 겹으로 어긋나면 낮추기
    turn_min_radius_mm: 0.0         # [mm] 좌/우 기억 중 가장 급한 회전 반지름 (0 = 기본 150). U턴을 못 돌아 바깥 선 넘으면 낮추기, 흔들리면 올리기
    turn_change_weight: 0.0         # 좌/우 기억 중 곡률 바꿈 벌점 (0 = 기본 15). 좌회전 진입 뒤 U턴으로 늦게 바뀌면 낮추기, 흔들리면 올리기
    turn_flip_delay_sec: 0.0        # [s] 교차로에서 곡선 방향이 바뀌면 (진입 -> U턴) 이만큼 직진한 뒤 회전. U턴을 일찍 시작해 안쪽 밟으면 올리기, 바깥 밟으면 낮추기 (0 = 끔)
    turn_center_cost: 0.0           # 교차로에서 두 선 사이 가운데를 따라가는 비용 (0 = 끔, 최단 경로). 코너 안쪽 밟으면 올리기, 흔들리면 낮추기
    turn_center_radius_mm: 250.0    # [mm] 가운데를 찾는 반경 (교차로 길 폭의 절반 이상). 가운데를 못 따라가면 올리기
    turn_exit_yaw_deg: 120.0  # [odom 도] 표지판 뒤 고리 U턴 (표지판 반대쪽) 으로 이만큼 돌면 출구 앞으로 보고 좌/우 기억 다시 켬. 출구 지나치면 낮추기, U턴 중 안쪽 붙으면 올리기 (0 = 끔)
    turn_exit_hold_sec: 1.5         # [s] 출구에서 좌/우 기억 켜는 시간
    sign_min_conf: 0.75              # 표지판을 믿는 최소 확신도

    # ===== 교차로: 예전 sliding 방식 (lane_follower 교차로 상태 기계 + 차선 추종) =====
    #   true 면 좌/우 표지판부터 고리 출구까지 lane_info (lane_detection) 차선 가운데 추종 + intersection.* 회전. 그 밖은 격자.
    #   false = 예전 격자 방식 (turn_* 값). intersection.* / lane.* 는 lane_follower.yaml (10-27 튜닝) 에서 복사, cmd_vel 단위
    #   (실제 = x 2.45). 로그 "[교차로] ..." / 디버그 화면 보라색 "X ..." 줄. lane_detection 이 떠 있어야 함 (bringup lane:=true)
    intersection_lane: false
    lane:
      linear_speed: 0.10          # [cmd_vel m/s] 교차로 차선 추종 직선 (실제 약 x 2.45)
      min_linear_speed: 0.06
      kp: 0.674
      kd: 0.0042
      ka: 0.253
      max_angular: 1.5
      slow_down_angle: 0.8
      low_confidence: 0.5
      d_filter_alpha: 0.3
      lane_timeout: 0.7          # [s] lane_info 가 이보다 오래 안 오면 차선 없음
      lost_hold_sec: 0.5          # [s] 차선을 잠깐 놓치면 직전 명령 유지, 넘으면 정지
    intersection:
      wheel_separation: 0.190   # [m] turn_pivot 용 (lane_follower wheel_separation)
      enabled: true
      sign_min_confidence: 0.7
      sign_min_area: 0.01
      sign_confirm_count: 4       # 최근 sign_confirm_window 프레임 중 같은 방향이 이만큼 (표지판 인식 10Hz)
      sign_confirm_window: 12     # 2026-10-14 표지판 5Hz -> 10Hz: 2/6 -> 4/12 (같은 1.2초 창, 같은 비율)
      sign_instant_confidence: 0.9   # 이 이상이면 한 번만 봐도 확정 (1.1 = 끔)
      arm_max_dist: 1.5           # [m] 표지판을 본 뒤 이만큼 가도 교차로가 없으면 잊음 (나중에 본 표지판이 이김)
      # 차선을 놓쳐도 lane_detection 이 T자 가로 선(cross_line)을 최근에 봤을 때만 교차로로 보고 돈다
      #   (test_052007: 진입 곡선에서 이미 58° 돈 뒤 차선을 한 프레임 놓친 걸 교차로로 보고 66° 더 돎. 그땐 가로 선 없음)
      #   로그 "[교차로] 차선 놓쳤지만 가로 선 없음 -> 회전 안 함" 이 나오면 이 조건 때문에 안 돈 것
      require_cross_line: true
      require_cross_line_grace: 0.4   # [s] 가로 선 없어도 이만큼 계속 차선을 놓치면 그냥 교차로로 보고 돎 (헤어핀 커브용)
      cross_recent_time: 1.0      # [s] 이 안에 본 가로 선만 인정 (녹화: 차선 놓치기 0.3초 전 ~ 직후에 보임)
      # 다가가며 정렬 (2026-10-13 사용자: "교차로 들어가면서 자연스럽게 정렬"): 표지판을 본 뒤 가로 선이 보이면
      #   차선 추종 조향에 -approach_align_kp * 기울기를 더하고 속도를 줄인다. 로그 "[교차로] 가로 선 보며 다가가며 정렬"
      #   녹화: T자 앞에서 6~14° 틀어져 있었고 가로 선은 차선 놓치기 0.5~1초 전부터 보임
      approach_align: true
      approach_align_kp: 2.0      # [rad/s per rad] (10° 틀어지면 0.35 rad/s 더함)
      approach_align_max: 0.4     # [rad/s]
      approach_align_fresh: 0.3   # [s] 이 안에 본 가로 선만 씀
      approach_slow_linear: 0.06  # [m/s] 가로 선이 보이면 이 속도 이하 (정렬할 시간 벌기, 0 = 그대로)
      # 돌기 전 정렬 (2026-10-13 사용자 요청): 그 자리에서 가로 선이 수평이 될 때까지 제자리 회전 -> 한쪽 바퀴 회전
      #   로그 "[교차로] 가로 선 수평 (..°, ..s)". GUI 차선 화면에 "CROSS +n deg" 로 기울기 표시
      align_enabled: false        # 2026-10-13 사용자 요청으로 잠깐 끔 (true = 가로 선 수평 맞춘 뒤 돎)
      align_kp: 3.0               # w = -align_kp * 기울기 [rad/s] (2026-10-13 사용자 요청으로 빠르게 1.5 -> 3.0)
      align_max_angular: 0.6      # [rad/s] (0.3 -> 0.6)
      align_min_angular: 0.15     # [rad/s] 이보다 느리면 바퀴가 안 돌 수 있어서 (0.12 -> 0.15)
      align_tol: 0.05             # [rad] (약 3°) 이 안이면 수평
      align_ok_count: 2           # 수평 프레임 연속 수
      align_max_time: 3.0         # [s] 넘으면 그냥 돎
      align_lost_time: 0.5        # [s] 가로 선이 이만큼 안 보이면 그냥 돎
      approach_time: 0.3          # [s] 정렬(ALIGN) 뒤 돌기 전에 직진 (0 = 바로 돎). 2026-10-13 사용자 요청 0.5 -> 0 -> 0.3
      approach_linear: 0.10       # [m/s]
      turn_pivot: true            # 도는 동안 안쪽 바퀴 0, 바깥 바퀴만 (바깥 바퀴 = turn_angular * wheel_separation)
                                  #   2026-10-13 사용자 요청: 가로 선에 수평 맞춘 뒤 한쪽 바퀴로 회전 (false = 제자리, turn_linear)
      turn_linear: 0.0            # [m/s] turn_pivot 이 false 일 때 도는 동안 전진 (0 = 제자리)
      turn_angular: 0.4           # [rad/s] turn_min_yaw 까지 (2026-10-13 사용자 요청으로 살짝 느리게 0.5 -> 0.4)
      turn_search_angular: 0.25   # [rad/s] turn_min_yaw 뒤 차선 찾는 동안 천천히 (0.3 -> 0.25)
      turn_min_yaw: 0.35          # [rad] (약 20°) 이만큼은 돌아야 끝낼 수 있음 (놓친 차선 / 가로 선 무시)
                                  #   test_041619: 1.3 (75°) 이면 왼쪽 44° / 오른쪽 38° 에서 보인 올바른 차선을 무시하고 더 돎
      turn_max_yaw: 2.2           # [rad] (약 126°) 이만큼 돌아도 차선이 없으면 포기 (정지)
      turn_switch_max_yaw: 0.6    # [rad] (약 34°) 이만큼 돌기 전에 반대 방향 표지판이 확정되면 그쪽으로 바꿔 돎
      exit_ok_count: 2            # 차선을 연속 이만큼 프레임 제대로 잡으면 끝 (2026-10-13 3 -> 2: 확인 지연만큼 더 돌던 것 줄임)
      exit_min_confidence: 0.5
      exit_max_angle: 0.5         # [rad] 차선 방향이 이 안이면 그 차선에 들어선 것
      exit_lead_angle: 0.75       # [rad] (43°) 도는 쪽으로 아직 이만큼 남았어도 올바른 차선이면 끝 -> 나머지는 차선 추종이 앞으로 가며 돎
                                  #   2026-10-13 사용자: "회전 때 많이 돌아서 바깥 선 밟고 들어옴". test_054541: 두 선이 41° 남았을 때부터
                                  #   보였는데 29° (exit_max_angle) 안까지 돌고 확인 / 지연으로 5~6° 더 돎. 0.5 = 예전처럼
      exit_max_offset: 0.9        # |offset| 이 이보다 크면 (로봇이 차선 밖 / 선이 반대쪽) 안 끝냄
      exit_turn_side_only: true   # 한 선만 보이면 도는 쪽 선(왼쪽 = 노란, 오른쪽 = 흰)일 때만 끝냄. 두 선이면 항상 OK
                                  #   (test_030522: 왼쪽으로 돌며 흰 선만 보고 56° 에서 끝내 이탈)
      rearm_dist: 0.5             # [m] 돈 뒤 이 거리 동안 표지판 무시
      # 왼쪽으로 돈 뒤 고리 출구: 고리를 시계 방향으로 돌다 출구에서 섬 노란 선을 따라 계속 도는 문제
      #   돈 뒤 오른쪽으로 out_trigger_yaw 꺾였거나, 차선을 놓치거나, 섬 끝 노란 선이 보이면 다시 왼쪽으로 돈다.
      #   로그 "[교차로] LOOP LEFT ..m ..°" 의 각도 보고 튜닝: 출구를 지나쳐 돌면 줄이고, 출구 전에 돌면 늘린다
      #   test_044608: 고리 위쪽을 따라 오른쪽으로 60~70° (0.45m) 꺾인 곳에서 노란 선이 왼쪽으로 휘어 사라지고
      #   섬 끝 노란 선을 왼쪽 선으로 잡아 (offset +1) 섬 쪽으로 꺾임 -> 그 전에 왼쪽으로 돈다
      # 돈 뒤 확인 (고리로 안 가는 회전 = out_right_enabled false 인 오른쪽): after_dist 안에서 차선을 놓치면 같은 쪽으로 더 돌며 찾음
      #   고리(LOOP) 처음 out_min_dist 안에서 놓쳐도 같은 값으로 더 돈 뒤 고리로 돌아감
      #   07:37 오른쪽 5번 중 1번: 30° 에서 회전 끝낸 뒤 (exit_lead_angle) 차선 추종 중 놓쳐 멈춤
      #   로그 "[교차로] 돈 뒤 ..m 에서 차선 놓침 -> 같은 쪽으로 더 돎"
      after_enabled: true
      after_dist: 0.4             # [m]
      after_max_yaw: 1.0          # [rad] (57°) 더 도는 최대
      after_max_retries: 2
      out_enabled: true
      # 오른쪽으로 돈 뒤에도 고리 출구 (10-27 182547_run 2회차: 오른쪽 길 고리를 왼쪽으로 62~66° 돈 출구의 노란 S자에서
      #   차선 놓쳐 정지). 왼쪽의 거울: 왼쪽으로 out_trigger_yaw 꺾이거나 차선 놓치면 EXIT (섬 쪽 = 왼쪽 차선 무시, 오른쪽 호).
      #   섬 끝 노란 선 조건(out_island_*)은 왼쪽 길만. false = 예전처럼 돈 뒤 AFTER 만
      out_right_enabled: true
      out_trigger_yaw: 1.05       # [rad] (약 60°)
      out_island_offset: 0.9      # 노란 선만 보이는데 offset 이 이 이상 (노란 선이 로봇 오른쪽 = 섬 끝) 이면 출구
      out_island_min_yaw: 0.6     # [rad] 섬 끝 판단은 고리를 이만큼 돈 뒤부터 (test_044608 1번: 노란 선을 넘어 밖으로 나가도 offset +1)
      out_min_dist: 0.3           # [m] 이만큼 간 뒤부터 출구 판단
      out_max_dist: 3.0           # [m] 이만큼 가도 출구 없으면 잊음
      out_approach_time: 0.0      # [s] 출구에서 돌기 전 직진
      out_turn_min_yaw: 0.6       # [rad] (약 34°) exit_max_angle 보다 커야 지금 따라가던 차선을 다시 안 잡음
      out_turn_max_yaw: 2.0       # [rad] (약 115°)
      # 출구에서 제자리 회전 대신 차선을 계속 따라감 (out_follow). test_054541: 출구에서 이미 S자 노란 선의 왼쪽 굽이에
      #   붙어 있어 제자리로 돌면 선을 넘어 바깥만 보였다 (out_turn_* 는 out_follow false 일 때만 씀)
      #   섬 쪽으로 치우친 차선 (offset >= out_guard_max_offset, 섬 끝 노란 선) 이나 차선 없음 -> 왼쪽으로 완만한 호
      #   로그 "[교차로] ... -> 완만하게 왼쪽". 출구에서 덜 꺾이면 out_arc_angular 를 늘린다
      out_follow: true
      out_guard_dist: 0.5         # [m] 이만큼 갈 동안 섬 쪽 차선 무시
      out_guard_max_offset: 0.6   # 출구 반대쪽(섬 쪽)으로 offset 이 이 이상이면 안 따라감 (고리에서 따라갈 때 최대 0.55)
      out_arc_linear: 0.08        # [m/s] 안 따라갈 때 호 (반지름 = 0.08 / 0.4 = 20cm)
      out_arc_angular: 0.4        # [rad/s]
      out_arc_max_dist: 0.2       # [m] 호는 출구 시작 뒤 이 안에서만, 그 뒤 섬 쪽 차선 / 차선 없음은 직전 조향 유지
                                  #   (06:46~ 로그: 출구 차선에 들어간 뒤 0.27~0.29m 에서 차선 잠깐 놓쳐 왼쪽 호 -> 갑자기 왼쪽, 7번 중 2번.
                                  #    직진으로 바꿨더니 07:26 S자 굽이에서 곧게 가 선을 넘음)
      out_hold_time: 0.8          # [s] 그동안 직전 차선 추종 명령 유지, 그래도 못 찾으면 직진. 로그 "-> 직전 조향 유지"

    # ===== 공사 구간 =====
    construction_hold_sec: 8.0      # [s] 공사 표지판을 본 뒤 공사 모드 (박스가 보이면 construction_box_hold_sec 씩 연장. 20 이면 공사 뒤 길까지 이어졌음) (odom 기억 켬, 차선 폭 지키기 끔)
    construction_box_hold_sec: 3.0  # [s] 공사 모드 중 박스가 보이면 최소 이만큼 연장
    construction_box_min_ratio: 0.002  # 박스로 보는 최소 넓이 비율 (지도 칸)
    construction_memory: true       # 공사 모드에서 odom 기억 (화면 밖으로 빠진 박스 옆면 기억). false = 보이는 것만
    construction_memory_lines: false   # 공사 모드 기억에 선도 넣을지 (false = 박스만. 어긋난 선 기억이 경로를 뒤집었음)

    construction_max_angular: 1.4   # [rad/s] 공사 모드 최대 회전 (0 = planner.max_angular). 박스 사이 과회전 줄이기. 박스 박으면 올리기
    construction_change_weight: 30.0  # 공사 모드 곡률 바꿈 벌점 (0 = planner 기본 15). 클수록 꺾고 되꺾는 지그재그 줄어듦, 반응은 느려짐5
    debug_jpeg_quality: 70          # 디버그 화면 화질 (0~100)
    w_median: 3                     # 한 프레임만 튀는 회전 거르기 (최근 몇 프레임의 가운데 값, 1 = 끔)
    accel_limit: 0.3                # [m/s^2 실제] 출발 / 가속을 이만큼만 (정지 -> 0.30 까지 1초). 출발 때 앞이 들리면 낮추기, 0 = 끔
    cmd_smooth: 0.5                 # 명령 부드럽게 (1 = 끔). 아직 출렁이면 0.2, 반응이 늦어 선 밟으면 0.5
    corner_delay_sec: 0.15          # 코너 발견 후 직진 시간 [s]. 안쪽 밟으면 ↑, 바깥 밟으면 ↓, 0 = 끔
    corner_k_min: 2.0               # 이보다 급한 곡선을 코너로 봄 [1/m] (2.0 = 반지름 50cm)
    corner_rearm_sec: 0.5           # 곡선이 이만큼 안 보이면 다음 코너 준비 [s]

    planner:
      # ----- 속도 -----
      linear: 0.35                  # [m/s 실제] 직선 최고 속도. 흔들리면 낮추기 (예전 0.24)
      slow_curvature: 0.5           # 곡선 감속: 속도 = linear x (1 - 이 값 x 곡률 / 최대 곡률). 0.2 면 가장 급한 곡선 0.24. 0 = 곡선도 linear
      min_linear: 0.03              # [m/s] 급한 곡선에서 이만큼까지 줄임. 코너에서 선 밟으면 낮추기
      max_angular: 1.5              # [rad/s 실제] 최대 회전 속도
      pivot_angular: 0.6            # [rad/s] 갈 곡선이 없을 때 제자리 회전 속도
      soft_speed_ratio: 1.0         # 선에 닿아 있을 때 속도 배율

      # ----- 곡선 따라가기 -----
      follow_mm: 250.0              # [mm] 이만큼 앞까지 한 곡선으로 따라감. 흔들리면 올리기

      # ----- 선과의 거리 -----
      robot_half_width_mm: 100.0    # [mm] 로봇 폭의 절반. 그대로
      line_margin_mm: 25.0          # [mm] 선과 로봇 옆면 사이 여유. 코너 안쪽 선 밟으면 올리기
                                    #   선 둘레 빨간 띠 폭 = robot_half_width_mm + line_margin_mm (지금 125mm). 띠를 줄이려면 이걸 낮추기 (음수 = 바퀴가 선에 걸쳐도 됨)
      recover_mm: 100.0             # [mm] 로봇 바로 앞 이 거리까지는 빨간 띠 대신 선에서 hard_line_mm 만 떨어지면 됨 (선 가까이 있어도 출발 / 복귀)
      hard_line_mm: 30.0            # [mm] 위 구간에서 경로 중심과 선 사이 최소 거리
      near_line_cost: 6.0           # 위 구간에서 빨간 띠 안을 지날 때 벌점 (클수록 빨리 가운데로 복귀)
      lane_half_mm: 150.0           # [mm] 차선 반폭 (선 중심 간격 297 / 2)
      far_line_cost: 50.0           # 선에서 차선 반폭보다 멀면 비용. 코너 안쪽 붙기 막음 (0 = 끔)
      box_depth_mm: 180.0           # [mm] 박스 바닥 접점에서 뒤로 막는 길이 (박스 두께). 박스가 너무 크게 막히면 낮추기
      box_gap_mm: 130.0             # [mm] 박스 뒤로 바닥이 이만큼 보여야 다른 박스로 봄 (작으면 박스가 겹겹이 커짐)
      memory_max_frames: 15         # 기억은 화면 밖에서 이 프레임 수 (30fps 15 = 0.5초) 지나면 잊음. 오래될수록 odom 이 어긋나 두 겹 선이 생김. 0 = 제한 없음
      box_memory_max_frames: 60     # 박스 기억만 따로 프레임 수 (30fps 60 = 2초, -1 = memory_max_frames 와 같게). 지나간 박스에 바퀴 걸리면 올리기
      memory_back_mm: 250.0         # [mm] 기억한 선이 바퀴 축 뒤로 이만큼 지나면 잊음
      box_memory_back_mm: 80.0      # [mm] 기억한 박스가 바퀴 축 뒤로 이만큼 지나면 잊음. 지나간 박스 영향 크면 낮추기 (음수 = 축 앞에서 잊음)
      box_margin_mm: 35.0           # [mm] 박스와 로봇 옆면 사이 여유

      # ----- 지도 / 기타 -----
      map_y_scale: 1.0              # 카메라 거리 보정. 그대로
      dead_end_stop_mm: 220.0       # [mm] 차단바 / 박스가 길을 다 막으면 갈 수 있는 끝 칸까지 가서 멈춤. 그 칸이 이 거리보다 가까우면 정지 (예전 방식)
      dead_end_line_mm: 50.0       # [mm] 코스 끝 (선 / 도로 끝이 길을 막음): 바퀴 축에서 이 거리가 되면 정지
      dead_end_slow_mm: 300.0       # [mm] 정지 거리보다 이만큼 멀 때부터 감속 (최저 30%)
      road_min_ratio: 0.0           # 0 = 도로가 조금만 보여도 도로 기준 (색만 쓰는 대체 없음)
      memory: false                 # true = 이전 지도를 기억해서 같이 씀