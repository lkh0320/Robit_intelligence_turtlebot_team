grid_drive:
  ros__parameters:
    # ===== 입력 =====
    image_topic: image_raw          # 카메라 영상 토픽

    # ===== 도로 인식 (YOLO 도로 분할) =====
    engine_path: ~/yolo26_check/road_r2_320_fp16.engine   # 도로 분할 모델 파일. 없으면 색으로만 선을 찾음
    use_road: true                  # true = 모델로 "내 차선" 영역도 같이 씀
    road_conf: 0.4                  # 도로라고 믿는 최소 확신도 (0~1). 도로를 놓치면 낮추기
    road_mask_thr: 0.4              # 도로 칸을 칠하는 기준 (0~1). 선 밖까지 칠해지면 올리기
    barrier_hold_sec: 1.5           # [s] 비전이 닫힌 차단바를 이 시간 안에 봤으면 막다른 길을 차단바로 (dead_end_stop_mm, 직진 없음). 차단바 앞에서 서면 이만큼 안 보여야 (올라가야) 출발
    barrier_creep_mm: 150.0         # [mm] 닫힌 차단바 앞에서 경로가 끊긴 뒤 이만큼 더 직진하고 정지 (빨간 줄무늬가 박스로 잡혀 멀리서 멈춤, 10-29 drive32). 더 가까이 가려면 올리기, 박으면 낮추기 (0 = 예전)
    barrier_stop_y: 0.35            # (10-29 새 방식) 닫힌 차단바가 보이면 화면 세로 위치 (GUI 객체 인식의 y) 가 이 값이 될 때까지 차선 따라 다가가서 정지. 멀리서 서면 올리기, 너무 붙으면 낮추기 (1 = 예전 경로 끊김 방식)
    barrier_approach_linear: 0.0    # [m/s] 닫힌 차단바로 다가가는 속도, 감속 없이 이 속도로 가다 정지 (0 = planner.linear)
    barrier_line_margin_mm: -10.0   # [mm] 닫힌 차단바가 보이는 동안 선 여유 (차단바 앞 좁은 길에서 양쪽 빨간 띠가 겹쳐 경로 없음 -> 멀리서 멈춤). 아직 멀리서 멈추면 더 낮추기 (음수 가능), 선 밟으면 올리기
    barrier_slow_mm: 0.0            # [mm] 닫힌 차단바 앞 감속 시작 (정지 거리보다 이만큼 멀 때부터 최저 30%). 0 = 감속 없음 (음수 = planner.dead_end_slow_mm)
    dead_end_lag_sec: 0.25          # [s] 모터 반응 지연. 코스 끝 정지 거리를 (속도 x 이 시간) 만큼 앞당김. 끝을 넘어가면 올리기, 너무 앞에서 서면 낮추기
    dead_end_creep_linear: 0.05     # [m/s] 차단바 / 코스 끝이 화면 아래로 빠진 뒤 남은 거리 직진: 직전 속도 그대로, 이 값은 최저 속도 (0 = 직진 안 함)
    road_hold_sec: 0.3              # [s] 도로 / 경로를 이 시간 이하로 놓치면 직전 명령 유지 (30fps 로 약 4 프레임). 0 = 바로 정지
    road_only: true                 # 경로는 주행 가능 구역 (초록) 안에서만. 초록이 없으면 계획 안 하고 정지

    # ===== 시작 / 속도 변환 =====
    autostart: false                # true = task_planner 없이 바로 주행. GUI STOP 이면 멈춤
    cmd_scale: 0.408                # 실제 속도 = cmd_vel x 2.45 (벨트 비). 건드리지 말기

    # ===== 처리 주기 / 안전 =====
    process_rate: 0.0              # [Hz] 1초에 몇 번 계산할지. 0 이하 = 매 프레임
    image_timeout: 0.5              # [s] 영상이 이 시간 넘게 안 오면 멈춤

    # ===== 갈림길 표지판 =====
    turn_hold_sec: 1.0              # [s] 왼쪽/오른쪽 표지판을 본 뒤 그쪽 길을 우선하는 시간
    turn_entry_max_sec: 3.0         # [s] 표지판 쪽으로 turn_exit_entry_deg 만큼 꺾어 들어갈 때까지 좌/우 기억을 이 시간까지 유지 (drive32: 1.0s 가 진입 전에 끝나 반대로 감). 표지판 반대로 가면 올리기 (0 = turn_hold_sec 만)
    turn_entry_commit: true         # 표지판 쪽으로 들어가기 전, 표지판 쪽 길을 한 번 찾으면 그 뒤로 반대쪽 목표 안 고름 (drive37: 섬 정면에서 좌우로 흔들리다 반대로 돎). false = 예전
    turn_entry_seek_linear: 0.08    # [m/s 실제] 위 고정 중 표지판 쪽 길이 안 보이면 이 속도로 가며 표지판 쪽으로 꺾음 (0 = 꺾지 않고 경로 없음 처리)
    turn_entry_seek_angular: 1.2    # [rad/s 실제] 그때 회전. 표지판 쪽 길이 늦게 보이면 올리기, 바깥 선 쪽으로 너무 돌면 낮추기
    turn_entry_left_early: true     # (10-30 새) 왼쪽 표지판: 본 순간부터 오른쪽 목표 안 고름 + 진입 각도는 왼쪽 길 찾은 뒤부터 셈 (drive38 117.6s / 10-30: 교차로 앞 왼쪽 코너 회전이 진입으로 세어져 표지판 앞까지 직진). 왼쪽 표지판 보고 엉뚱하게 왼쪽으로 꺾으면 false
    turn_soft_line_block_mm: 0.0    # (10-30 새) 교차로 (좌/우 기억 / U턴) 중 planner.soft_line_block_mm 대신 (0 = 교차로에선 soft 선 막기 끔 = drive42 까지와 같음, -1 = planner 값). drive43: 진입 / 출구 "목표 없음" 정지
    turn_entry_after_seek_sec: 0.0  # (10-30 1.5 -> 0: drive43 들어간 직후 매번 0.08 m/s 로 뚝 멈춤) [s] 들어감 판정 뒤에도 이 시간 동안 길이 안 보이면 표지판 쪽으로 꺾으며 천천히 (들어간 직후 목표 없음으로 섬). 바깥 선 쪽으로 너무 돌면 낮추기 (0 = 끔)
    turn_linear: 0.35               # [m/s] 좌/우 기억 중 속도 (0 = 감속 안 함, 직선은 planner.linear)
    turn_track_outer_right_mm: 30.0 # (10-30 40 -> 30) [mm] 오른쪽 교차로 바깥 비킴 (planner.track_outer_mm 대신, 왼쪽은 planner 값). 오른쪽 U턴 바깥 선 밟으면 낮추기, 안쪽 밟으면 올리기 (음수 = planner 값)
    turn_memory: true               # 좌/우 기억 중 odom 기억 켬 (안쪽 선이 화면 밖으로 빠져도 안 넘게)
    turn_line_margin_mm: 10.0       # [mm] 좌/우 기억 중 선 여유 (planner.line_margin_mm 대신). 진입 때 우회전 쪽 빨간 띠가 길을 막으면 낮추기 (음수 가능)
    turn_line_margin_left_mm: 70.0  # [mm] (10-29 25 -> 40: 왼쪽 진입 안쪽 선 밟음) 왼쪽 표지판 진입 때 선 여유 (위 값은 오른쪽). 왼쪽 코너 안쪽 밟으면 올리기, 왼쪽 길로 못 들어가면 낮추기
    turn_line_margin_sec: 1.8       # [s] 위 여유는 표지판을 마지막으로 본 뒤 이 시간만 (진입). 그 뒤 U턴은 planner.line_margin_mm. U턴 안쪽 밟으면 낮추기, 진입 못 하면 올리기 (0 = 내내)
    turn_entry_margin_until_entered: true  # 표지판 쪽으로 turn_exit_entry_deg 들어간 뒤에는 진입 여유를 turn_after_margin_mm 보다 작게 안 함 (drive36: 오른쪽 진입 10mm 가 섬 끝까지 이어져 표지판 섬 노란선 밟음). false = 예전처럼 시간만
    turn_after_margin_mm: 55.0      # [mm] 진입 뒤 좌/우 기억 중 선 여유 (U턴). 안쪽 선 밟으면 올리기, 바깥 선 밟거나 경로 못 찾으면 낮추기
    turn_memory_max_frames: 0      # 좌/우 기억 중 선 기억 프레임 수 (30fps 45 = 1.5초, 0 = planner.memory_max_frames). U턴 안쪽 선이 화면 밖으로 빠져도 기억. 선이 두 겹으로 어긋나면 낮추기
    turn_min_radius_mm: 0.0         # [mm] 좌/우 기억 중 가장 급한 회전 반지름 (0 = 기본 150). U턴을 못 돌아 바깥 선 넘으면 낮추기, 흔들리면 올리기
    turn_change_weight: 0.0         # 좌/우 기억 중 곡률 바꿈 벌점 (0 = 기본 15). 좌회전 진입 뒤 U턴으로 늦게 바뀌면 낮추기, 흔들리면 올리기
    turn_flip_delay_sec: 0.0        # [s] 교차로에서 곡선 방향이 바뀌면 (진입 -> U턴) 이만큼 직진한 뒤 회전. U턴을 일찍 시작해 안쪽 밟으면 올리기, 바깥 밟으면 낮추기 (0 = 끔)
    turn_center_cost: 0.0           # 교차로에서 두 선 사이 가운데를 따라가는 비용 (0 = 끔, 최단 경로). 코너 안쪽 밟으면 올리기, 흔들리면 낮추기
    turn_center_radius_mm: 250.0    # [mm] 가운데를 찾는 반경 (교차로 길 폭의 절반 이상). 가운데를 못 따라가면 올리기
    turn_uturn_margin_mm: 55.0      # (10-30 새) [mm] 교차로 U턴 중 (들어간 뒤 출구 전, 좌/우 기억이 끝나도) 선 여유 최소값 (drive40 오른쪽 U턴 안쪽 밟음). 안쪽 밟으면 올리기, 바깥 밟거나 경로 못 찾으면 낮추기 (음수 = 끔)
    turn_uturn_margin_left_mm: 35.0 # (10-30 새) 왼쪽 표지판 U턴 선 여유 (위 값은 오른쪽). drive41: 왼쪽 진입 70 이 U턴까지 이어져 고리를 바깥 노란선에 붙어 돎. 바깥 밟으면 낮추기, 안쪽 밟으면 올리기 (음수 = 위 값)
    turn_track_outer_left_mm: 20.0  # (10-30 새) [mm] 왼쪽 교차로 (U턴 포함) 바깥 비킴 (planner.track_outer_mm 대신). 바깥 선 밟으면 낮추기 (음수 = planner 값)
    turn_uturn_memory: true         # (10-30 새) U턴 중 선 odom 기억 (안쪽 고리 선이 화면 밖으로 빠져도). false = 예전
    turn_exit_yaw_deg: 120.0  # [odom 도] 표지판 뒤 고리 U턴 (표지판 반대쪽) 으로 이만큼 돌면 출구 앞으로 보고 좌/우 기억 다시 켬. 출구 지나치면 낮추기, U턴 중 안쪽 붙으면 올리기 (0 = 끔)
    turn_exit_hold_sec: 1.5         # [s] 출구에서 좌/우 기억 켜는 시간 (최대. 아래 turn_exit_turn_deg 만큼 돌면 먼저 끝)
    turn_exit_entry_deg: 25.0       # [odom 도] 표지판 쪽으로 이만큼 꺾어 들어간 뒤부터 U턴 양을 셈 (교차로 앞 코너 회전을 U턴으로 세지 않게). 0 = 바로
    turn_exit_turn_deg: 45.0        # [odom 도] 출구에서 표지판 쪽으로 이만큼 돌면 좌/우 기억 끝. 출구 바깥 선 넘으면 낮추기, 출구로 못 꺾으면 올리기 (0 = 시간만)
    sign_min_conf: 0.75              # 표지판을 믿는 최소 확신도

    # ===== 공사 구간 =====
    construction_hold_sec: 8.0      # [s] 공사 표지판을 본 뒤 공사 모드 (박스가 보이면 construction_box_hold_sec 씩 연장. 20 이면 공사 뒤 길까지 이어졌음) (odom 기억 켬, 차선 폭 지키기 끔)
    construction_box_hold_sec: 3.0  # [s] 공사 모드 중 박스가 보이면 최소 이만큼 연장
    construction_box_min_ratio: 0.002  # 박스로 보는 최소 넓이 비율 (지도 칸)
    construction_memory: true       # 공사 모드에서 odom 기억 (화면 밖으로 빠진 박스 옆면 기억). false = 보이는 것만
    construction_memory_lines: true   # (10-30 false -> true: drive41 오른쪽 첫 박스 앞 코너에서 노란선 끝이 화면 아래로 빠져 잊고 밟음, 선 기억은 memory_max_frames 0.5초만) 공사 모드 기억에 선도 넣을지. 경로가 뒤집히면 false (박스만)

    construction_max_angular: 1.2   # [rad/s] 공사 모드 최대 회전 (0 = planner.max_angular). 박스 사이 과회전 줄이기. 박스 박으면 올리기
    construction_linear: 0.30       # (10-30 0.50 -> 0.30, drive39 2회차 첫 박스 침) [m/s 실제] 공사 모드 속도 (0 = 감속 안 함). 박스 박으면 낮추기
    construction_pivot_linear: 0.08  # [m/s 실제] 공사 구간에서 갈 원호가 다 막히면 (직전 명령 유지 없이 바로) 제자리 회전 대신 이 속도로 가며 최대 회전. 박스를 크게 돌면 낮추기, 멈칫하면 올리기, 0 = 제자리 회전
    construction_accel_limit: 1.0   # [m/s^2 실제] 공사 구간 가속 제한 (멈칫 뒤 빨리 원래 속도로). 출발 때 앞 들리면 낮추기, 음수 = accel_limit
    construction_box_near_mm: 450.0  # (10-30 새) [mm] 공사 모드 동작 (회전 제한 / 바깥 비킴 끔 / 먼 선 비용 끔 / 막히면 천천히 꺾기) 은 바퀴 축 앞 이 거리 안에 박스가 보이거나 박스 기억이 있을 때만 (drive40: 표지판 직후 / 박스 뒤 코너에서 선 넘고 멈칫). 박스 옆에서 공사 동작이 늦게 켜지면 올리기, 0 = 예전 (공사 모드 내내)
    construction_box_near_hold_sec: 0.5  # [s] 박스가 멀어진 뒤 공사 동작 유지 시간
    construction_track_outer_mm: 0.0  # [mm] 공사 구간 바깥 비킴 (planner.track_outer_mm 대신, 박스 쪽으로 밀어 바퀴로 침 10-29). 음수 = planner 값
    construction_change_weight: 30.0  # 공사 모드 곡률 바꿈 벌점 (0 = planner 기본 15). 클수록 꺾고 되꺾는 지그재그 줄어듦, 반응은 느려짐5
    debug_jpeg_quality: 70          # 디버그 화면 화질 (0~100)
    w_median: 3                     # 한 프레임만 튀는 회전 거르기 (최근 몇 프레임의 가운데 값, 1 = 끔)
    accel_limit: 0.3                # [m/s^2 실제] 출발 / 가속을 이만큼만 (정지 -> 0.30 까지 1초). 출발 때 앞이 들리면 낮추기, 0 = 끔
    cmd_smooth: 0.5                 # 명령 부드럽게 (1 = 끔). 아직 출렁이면 0.2, 반응이 늦어 선 밟으면 0.5
    lead_sec: 0.2                   # [s] 지연 보정: 원호를 지금 명령으로 이 시간 더 간 자리에서 고름. 직선에서 출렁이면 올리기, 코너에서 늦게 꺾으면 낮추기 (0 = 끔)
    corner_delay_sec: 0.0          # (10-29 새 따라가기 track_len_mm 쓰면 0, 예전 방식은 0.25~0.35) 코너 발견 후 직진 시간 [s]. 안쪽 밟으면 ↑, 바깥 밟으면 ↓, 0 = 끔
    corner_k_min: 2.0               # 이보다 급한 곡선을 코너로 봄 [1/m] (2.0 = 반지름 50cm)
    corner_rearm_sec: 0.5           # 곡선이 이만큼 안 보이면 다음 코너 준비 [s]

    planner:
      # ----- 속도 -----
      linear: 0.50                  # [m/s 실제] 직선 최고 속도. 흔들리면 낮추기 (예전 0.24)
      slow_curvature: 0.5           # 곡선 감속: 속도 = linear x (1 - 이 값 x 곡률 / 최대 곡률). 0.2 면 가장 급한 곡선 0.24. 0 = 곡선도 linear
      min_linear: 0.03              # [m/s] 급한 곡선에서 이만큼까지 줄임. 코너에서 선 밟으면 낮추기
      max_angular: 2.5              # [rad/s 실제] 최대 회전 속도
      pivot_angular: 0.6            # [rad/s] 갈 곡선이 없을 때 제자리 회전 속도
      soft_speed_ratio: 1.0         # 선에 닿아 있을 때 속도 배율
      soft_depth_cost: 60.0         # 선 여유를 못 지킬 때 (SOFT) 선에 가까울수록 이만큼 벌점 -> 두 선 가운데로. 그래도 안쪽 밟으면 올리기, 좁은 길에서 멈칫하면 낮추기 (0 = 예전)

      # ----- 곡선 따라가기 -----
      follow_mm: 250.0              # [mm] 이만큼 앞까지 한 곡선으로 따라감. 흔들리면 올리기
      track_len_mm: 200.0           # [mm] (10-29 새 방식) 0 보다 크면 원호 맞춤 대신 로봇 자리의 경로 옆 거리 / 방향으로 따라감 (코너 안쪽 밟음 대책). 직선에서 출렁이면 올리기, 코너 바깥으로 밀리면 낮추기, 0 = 예전 원호 맞춤
      track_preview_mm: 80.0        # [mm] 경로 곡률을 재는 앞 구간. 코너에서 늦게 꺾으면 올리기
      track_outer_mm: 60.0          # (10-30 90 -> 60, drive39: 바깥 선 넘음) [mm] 굽은 길에서 경로보다 바깥으로 이만큼 비켜 따라감 (가장 급한 곡선에서 다). track_outer_fit 켜면 선 띠에 들어가면 반 / 0 으로 줄임. 안쪽 밟으면 올리기, 바깥 밟으면 낮추기 (0 = 끔)
      track_outer_fit: 1.0          # (10-30 새) 1 = 비킨 원호가 선 띠 (빨간 칸) 에 들어가면 비킴 1 -> 0.5 -> 0 중 덜 들어가는 것 (drive39: SOFT 라 비킴 90mm 가 그대로 바깥 선 넘음). 0 = 예전
      track_slow_ahead: 1.0         # (10-30 새) 코너 앞 감속: 앞 track_bend_mm 안 경로 꺾임을 지금 곡률처럼 보고 미리 감속 (drive39: 0.5 m/s 로 코너 들어가 늦게 꺾음). 코너 앞에서 너무 느리면 0.5, 0 = 끔
      track_block_ok_mm: 20.0       # (10-30 새, 100 -> 20: drive42 공사 표지판 직전 코너 39.2s 차선 가운데 경로인데 원호가 100mm 안에서 띠에 닿아 제자리 회전 = 멈칫) [mm] 따라가는 원호가 이보다 멀리서 막히면 그대로 따라감 (경로는 soft 라도 선을 안 건넘). 선 / 박스에 붙으면 올리기 (최대 check_mm 200), 0 = 예전
      soft_line_block_mm: 100.0     # (10-30 새, 실격 방지) [mm] soft 경로 (선 띠에 들어가서라도 가는 경로) 도 로봇 앞 이 거리보다 먼 곳에서는 선 중심 soft_line_keep_mm 안을 못 지나감 = 선을 건너는 경로 금지 (drive42: 공사 앞 코너에서 왼쪽 노란선 건너 옆 끝으로 감). 0 = 예전 (벌점만)
      soft_line_keep_mm: 60.0       # [mm] 위에서 로봇 중심이 선 중심에 이보다 가까우면 못 감 (로봇 반폭 100 이라 60 = 몸이 선에 40mm 걸침까지). 실격 위험 크면 올리기, 길 못 찾고 서면 낮추기
      track_bend_mm: 300.0          # [mm] 길이 어느 쪽으로 휘는지 보는 앞 거리 (바깥 비킴 방향). 코너 들어가기 전에 너무 일찍 바깥으로 가면 낮추기

      # ----- 선과의 거리 -----
      robot_half_width_mm: 100.0    # [mm] 로봇 폭의 절반. 그대로
      line_margin_mm: 20.0          # (10-30 35 -> 20: 띠 135mm 면 차선 안 빈 폭 ~7mm 라 거의 항상 SOFT / 원호 막힘 / soft 로 선 건넘) [mm] 선과 로봇 옆면 사이 여유. 코너 안쪽 선 밟으면 25 로 올리기
                                    #   선 둘레 빨간 띠 폭 = robot_half_width_mm + line_margin_mm (지금 125mm). 띠를 줄이려면 이걸 낮추기 (음수 = 바퀴가 선에 걸쳐도 됨)
      recover_mm: 100.0             # [mm] 로봇 바로 앞 이 거리까지는 빨간 띠 대신 선에서 hard_line_mm 만 떨어지면 됨 (선 가까이 있어도 출발 / 복귀)
      hard_line_mm: 30.0            # [mm] 위 구간에서 경로 중심과 선 사이 최소 거리
      near_line_cost: 6.0           # 위 구간에서 빨간 띠 안을 지날 때 벌점 (클수록 빨리 가운데로 복귀)
      lane_half_mm: 150.0           # [mm] 차선 반폭 (선 중심 간격 297 / 2)
      far_line_cost: 50.0           # 선에서 차선 반폭보다 멀면 비용. 코너 안쪽 붙기 막음 (0 = 끔)
      box_depth_mm: 180.0           # [mm] 박스 바닥 접점에서 뒤로 막는 길이 (박스 두께). 박스가 너무 크게 막히면 낮추기
      box_gap_mm: 130.0             # [mm] 박스 뒤로 바닥이 이만큼 보여야 다른 박스로 봄 (작으면 박스가 겹겹이 커짐)
      memory_max_frames: 15         # 기억은 화면 밖에서 이 프레임 수 (30fps 15 = 0.5초) 지나면 잊음. 오래될수록 odom 이 어긋나 두 겹 선이 생김. 0 = 제한 없음
      box_memory_max_frames: 60     # 박스 기억만 따로 프레임 수 (30fps 60 = 2초, -1 = memory_max_frames 와 같게). 지나간 박스에 바퀴 걸리면 올리기
      memory_back_mm: 250.0         # [mm] 기억한 선이 바퀴 축 뒤로 이만큼 지나면 잊음
      box_memory_back_mm: 200.0      # (10-29 80 -> 200: 지나간 박스를 바퀴 옆에서 잊고 꺾어 침) [mm] 기억한 박스가 바퀴 축 뒤로 이만큼 지나면 잊음. 지나간 박스 영향 크면 낮추기 (음수 = 축 앞에서 잊음)
      box_margin_mm: 48.0           # (10-30 43 -> 55 -> 48: 55 는 박스 옆 길이 막혀 soft 로 빠짐, 속도 0.30 이라 48) [mm] 박스와 로봇 옆면 사이 여유. 박스 박으면 올리기, 박스 사이 길 못 찾으면 낮추기

      # ----- 지도 / 기타 -----
      map_y_scale: 1.0              # 카메라 거리 보정. 그대로
      dead_end_stop_mm: 220.0       # [mm] 차단바 / 박스가 길을 다 막으면 갈 수 있는 끝 칸까지 가서 멈춤. 그 칸이 이 거리보다 가까우면 정지 (예전 방식)
      dead_end_line_mm: 150.0      # [mm] 코스 끝 (선 / 도로 끝이 길을 막음): 바퀴 축에서 이 거리가 되면 정지
      dead_end_slow_mm: 0.0         # [mm] 정지 거리보다 이만큼 멀 때부터 감속 (최저 30%). 0 = 감속 없음
      road_min_ratio: 0.0           # 0 = 도로가 조금만 보여도 도로 기준 (색만 쓰는 대체 없음)
      memory: false                 # true = 이전 지도를 기억해서 같이 씀