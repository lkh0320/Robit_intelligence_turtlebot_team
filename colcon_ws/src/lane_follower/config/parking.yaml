parking:
  ros__parameters:
    # task_planner 를 같이 쓰는지 (launch 파일이 task_planner 인자에 맞춰 정한다)
    #   false: 이 노드가 control_mode 를 직접 PARKING / LANE 으로 바꾼다
    #   true : control_mode 는 task_planner 가 보내고, 이 노드는 parking_active / parking_done 만 알린다
    use_task_planner: false

    # 1) 주차 표지판 인식 -> 주차 구역 모드 시작
    min_confidence: 0.5             # YOLO 신뢰도가 이보다 낮으면 무시
    sign_area_ratio_threshold: 0.03 # 표지판 크기 / 화면 크기. 이보다 커야(= 가까워야) 시작
    sign_hits_needed: 3             # 연속으로 이만큼 봐야 시작

    # 2) 주차 구역 들어감 / 끝 (오른쪽 흰선)
    lane_frames_needed: 5           # 오른쪽 흰선이 연속 이만큼 안 보이면 "구역 안", 다시 보이면 "구역 끝"
    zone_timeout: 40.0              # [s] 구역 모드가 이보다 길면 그냥 끝냄 (흰선을 못 찾을 때 대비)

    # 3) 장애물 칸 찾기 (옆 PSD)
    side_psd_threshold: 0.20        # [m] 왼쪽/오른쪽 PSD 가 이 이하면 그쪽 칸에 장애물
    side_psd_hits_needed: 3         # 연속 이만큼 (잡음 걸러내기)

    # 4) 주차 동작
    linear_speed: 0.08              # [m/s] 전진 속도
    angular_speed: 0.6              # [rad/s] 회전 속도 (90도 = 약 2.6초)
    align_time: 0.0                 # [s] 돌기 전에 칸 가운데까지 더 갈 시간 (0 = 바로 돎)
    enter_time: 2.0                 # [s] 칸 안으로 전진하는 시간
    park_wait_time: 2.0             # [s] 칸 안에서 서 있는 시간
    exit_front_distance: 0.30       # [m] 나올 때 앞 PSD 가 이 이하가 되면 멈추고 돌기
                                    #     (건너편 칸 장애물까지 거리. PSD 는 0.8m 까지만 잼)
    exit_timeout: 4.0               # [s] 나올 때 위 조건이 안 돼도 이 시간이 지나면 돌기

    # 안전
    front_stop_distance: 0.10       # [m] 전진 중 정면 PSD 가 이보다 가까우면 대기 (0 = 끔)
    control_rate: 20.0              # [Hz]
