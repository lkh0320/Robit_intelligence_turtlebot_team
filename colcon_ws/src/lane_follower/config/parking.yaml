parking:
  ros__parameters:
    # 1) 주차 표지판 -> 가로 노란선 찾기 시작
    min_confidence: 0.5             # YOLO 신뢰도가 이보다 낮으면 무시
    sign_area_ratio_threshold: 0.0  # 표지판 크기 / 화면 크기. 이보다 커야 시작 (0 = 크기 상관없음)
    sign_hits_needed: 1             # 연속으로 이만큼 봐야 시작
    search_timeout: 40.0            # [s] 표지판 본 뒤 이 시간 안에 가로선을 못 찾으면 그만둠 (0 = 끔)
    skip_sign: false                # 시험용. true 면 표지판 없이 켜자마자 가로선 찾기
                                    #   ros2 launch lane_follower parking.launch.py skip_sign:=true

    # 2) 가로 노란선 찾기. BEV 400x400, 1px = 1mm (bird_eye_view.yaml 과 같게, 2026-10-13 카메라 각도 수정 후 재보정)
    image_topic: image_bev
    yellow_l_min: 80                # 노란색 범위 (lane_detection.yaml 과 같게)
    yellow_b_min: 150
    yellow_a_max: 135
    bev_center_x: 0.5               # 로봇 가로 위치 (화면 폭 비율). 이보다 왼쪽에서만 찾는다
    robot_y_offset_px: 179.0        # 화면 맨 아래가 바퀴 축에서 몇 px(mm) 앞인지 (17.9cm, 2026-10-13 재보정. 예전 14.1cm)
                                    #   path_planner / map_planner 의 robot_y_offset_px 와 같게
    bev_m_per_px: 0.001
    lane_width_px: 295.0            # 차선 폭 (lane_detection.yaml 과 같게). 입구 가운데 = 가로선 + 이 절반
    hline_min_pixels: 35            # 한 줄에 노란 점이 이만큼 이상이면 "가로선" 줄 (못 찾으면 줄이기)
    hline_min_rows: 3               # 가로선 두께가 이 줄 수보다 얇으면 잡음
    hline_hits_needed: 2            # 연속 이만큼 프레임에서 보여야 시작
    road_min_rows: 40               # 가로선 아래 차선이 이 줄 수 이상 보여야 도로 방향을 계산 (아니면 로봇 방향 사용)

    # 3) 움직이기 (엔코더 odom 으로 거리/각도를 잰다)
    forward_speed: 0.08             # [m/s]
    forward_extra_m: 0.0            # [m] 계산한 거리에 더할 값 (늦게 돌면 -, 일찍 돌면 +)
    heading_kp: 2.0                 # 직진 중 방향이 틀어지면 되돌리는 세기
    turn_angle_deg: 90.0            # 왼쪽으로 돌 각도
    turn_kp: 2.0                    # 남은 각도 -> 회전 속도
    turn_max_speed: 0.6             # [rad/s]
    turn_min_speed: 0.12            # [rad/s] 끝에서 너무 느려 멈추지 않게
    turn_tolerance_deg: 0.5         # 이만큼 안으로 들어오면 회전 끝

    # 안전
    front_stop_distance: 0.10       # [m] 직진 중 정면 PSD 가 이보다 가까우면 대기 (0 = 끔)
    odom_timeout: 0.5               # [s] odom 이 이만큼 안 오면 정지
    control_rate: 20.0              # [Hz]
