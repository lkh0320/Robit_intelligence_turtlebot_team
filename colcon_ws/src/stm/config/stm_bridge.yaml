stm_bridge:
  ros__parameters:
    port: /dev/ttyUSB0
    baud: 115200
    wheel_separation: 0.190   # [m] 좌우 바퀴 간격 19cm (2026-10-13 실측). cmd_vel 각속도 -> 바퀴 속도 차, 오도메트리 회전
    max_wheel_speed: 0.30     # [m/s] 바퀴 선속도 상한 (펌웨어 MAX_WHEEL_MPS 와 같게)
    cmd_timeout: 0.5          # [s] cmd_vel이 끊기면 정지
    tx_rate: 20.0             # [Hz] WHEEL_CMD 송신 주기
    psd_frame_id: base_link
    # 엔코더 (펌웨어 0x11 프레임) -> odom, dxl_state 바퀴 속도
    wheel_radius: 0.1225      # [m] 모터 1바퀴당 유효 반지름 = 바퀴 4.8cm x 벨트 약 2.55 (2026-10-28 줄자 13cm / odom 5.3cm). 펌웨어 WHEEL_RADIUS_M(0.05) 은 그대로 -> 실제 속도는 cmd_vel 의 약 2.45배
    encoder_timeout: 0.3      # [s] 엔코더 프레임이 이만큼 끊기면 dxl_state 속도는 STATUS/명령 값 사용
    max_jump_ticks: 2048      # 0.05초에 이보다 많이 변하면 (모터 재부팅) 그 차이는 버림 (4096 = 1바퀴)
    odom_frame_id: odom
    base_frame_id: base_link
    publish_tf: false         # true 면 odom -> base_link TF 도 발행
