task_planner:
  ros__parameters:
    tick_rate: 20.0                        # [Hz] 상태머신 판단 주기
    min_confidence: 0.5                    # 인식 결과 신뢰도 하한, 이보다 낮으면 무시
    sign_area_ratio_threshold: 0.05        # bbox면적/이미지면적, 표지판이 이정도로 가까워야 갈림길 표시
    psd_obstacle_threshold: 0.25           # [m] 이보다 가까우면 AVOID 진입
    psd_clear_threshold: 0.35              # [m] 이보다 멀어야 회피 종료 후보 (히스테리시스)
    psd_clear_count: 10                    # [tick] 회피 종료 판정 전 연속으로 클리어해야 하는 횟수
    parking_offset_threshold: 0.05         # 주차 정렬 허용 오차 (정규화값)
    parking_stop_velocity_threshold: 0.02  # [m/s] 이보다 느려야 "정지"로 판단
    parking_stable_duration: 0.5           # [s] 정렬+정지가 이 시간 유지되면 주차 완료로 판정
    parking_sign_area_ratio_threshold: 0.03 # 주차 표지판 크기/화면 크기, 이보다 커야 PARKING 진입
    parking_sign_hits_needed: 3            # 주차 표지판을 연속으로 이만큼 봐야 PARKING 진입
    parking_quiet_sec: 0.5                 # [s] 주차 노드가 PARKING 을 보내는 동안 (이 시간 안에 받았으면) 이 노드는 모드를 안 보냄
    barrier_stop: false                    # 차단바 인식으로 정지 (2026-10-28 끔: grid_drive 가 차단바 앞에서 알아서 멈춤). 다시 쓰려면 true
    barrier_cross_duration: 3.0            # [s] 차단바 통과 후 정지까지 임시 고정시간
                                            # TODO(vision): 터널 입구 인식 메시지 생기면 교체
    barrier_stop_y_ratio: 0.5              # 차단바가 화면 세로 비율로 이만큼(0 상단~1 하단) 가까워져야 정지
    barrier_lost_count: 10                 # [tick] 차단바가 이만큼 연속으로 안 보여야 "치워짐"으로 보고 통과
                                            # (bar_open 인식이 잘 안 돼서 안 보이는 것도 열림으로 취급)
