bird_eye_view:
  ros__parameters:
    image_topic: image_raw
    # 원본에서 펼 사다리꼴 네 점 (이미지 폭/높이 비율, 0~1 밖도 가능)
    # 보정: 직선 차선 위에서 BEV 의 두 차선이 격자 세로선과 평행해질 때까지 조절
    # 2026-10-08 카메라 위치 변경 후 재실측: 640x480 에서 노란/흰 차선 직선부(y 220~480)의 소실점(340, 43)으로 계산
    #   노란 선 x = -0.660y + 368.5, 흰 선 x = 0.631y + 313.4
    # 사다리꼴은 화면 중앙(x=0.5) 기준 좌우 대칭 (로봇 정면 = BEV 세로선), 차선 간격이 BEV 폭의 2/3,
    # 먼 쪽/가까운 쪽 거리 비율은 이전 보정(2026-10-02)과 같게 (lane_detection/path_planner 픽셀 값 유지)
    # 소실점 x 가 중앙보다 20px 오른쪽이라 직선 차선이 BEV 에서 살짝 오른쪽으로 기운다 (로봇이 비스듬히
    # 놓였던 것이면 정상, 카메라가 틀어진 것이면 사다리꼴 중심을 옮겨야 함)
    # 아랫변이 화면보다 넓어(0~1 밖) BEV 아래 양 모서리는 검게 나온다
    src_top_y: 0.467
    src_top_left_x: 0.225
    src_top_right_x: 0.775
    src_bottom_y: 1.0
    src_bottom_left_x: -0.162
    src_bottom_right_x: 1.162
    bev_width: 400           # 출력 크기 [px]
    bev_height: 400
    draw_grid: true          # GUI용 압축 영상에만 격자 표시
    jpeg_quality: 70
