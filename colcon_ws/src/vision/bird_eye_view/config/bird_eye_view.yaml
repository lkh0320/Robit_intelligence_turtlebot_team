bird_eye_view:
  ros__parameters:
    image_topic: image_raw
    # 원본에서 펼 사다리꼴 네 점 (이미지 폭/높이 비율, 0~1 밖도 가능)
    # 보정: 직선 차선 위에서 BEV 의 두 차선이 격자 세로선과 평행해질 때까지 조절
    # 2026-10-02 카메라 높이/각도 재변경 후 재실측: 640x480 에서 노란/흰 차선 직선부의 소실점(375, 22)으로 계산
    # 사다리꼴은 화면 중앙(x=0.5) 기준 좌우 대칭 (로봇 정면 = BEV 세로선), 차선 간격이 BEV 폭의 2/3
    # 아랫변이 화면보다 넓어(0~1 밖) BEV 아래 양 모서리는 검게 나온다
    src_top_y: 0.442
    src_top_left_x: 0.178
    src_top_right_x: 0.822
    src_bottom_y: 1.0
    src_bottom_left_x: -0.276
    src_bottom_right_x: 1.276
    bev_width: 400           # 출력 크기 [px]
    bev_height: 400
    draw_grid: true          # GUI용 압축 영상에만 격자 표시
    jpeg_quality: 70
