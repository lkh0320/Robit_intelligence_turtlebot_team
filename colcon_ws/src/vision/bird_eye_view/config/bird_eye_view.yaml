bird_eye_view:
  ros__parameters:
    image_topic: image_raw
    # 원본에서 펼 사다리꼴 네 점 (이미지 폭/높이 비율, 0~1 밖도 가능)
    # 보정: 직선 차선 위에서 BEV 의 두 차선이 격자 세로선과 평행해질 때까지 조절
    # 2026-10-09 카메라 재설치 후 보정. 실측: 렌즈 높이 24cm, 수평 기준 45° 아래, 바퀴 축 -> 렌즈 9cm
    #   640x480 직선 차선(y 80~478)의 소실점 (360, -129): 노란 선 x = -0.480y + 298.6, 흰 선 x = 0.390y + 410.8
    #   주점 (320, 240) 가정 -> 초점거리 f = (240 + 129) / tan45° = 369px (가로 화각 약 82°)
    # 이 카메라 모델로 바닥의 직사각형을 원본에 투영해 사다리꼴을 계산했다 -> BEV 는 가로·세로 모두 1px = 1mm
    #   로봇 정면 기준 좌우 ±20cm, 화면 맨 아래(렌즈 앞 5.1cm)부터 40cm 앞까지 = 바퀴 축 앞 14.1cm ~ 54.1cm
    #   사다리꼴은 화면 중앙(x=0.5) 기준 좌우 대칭 (로봇 정면 = BEV 세로선)
    # 보정 영상에서 두 차선 중심 간격은 BEV 295px (= 29.5cm), 테이프 폭 약 18px.
    #   실제 차선 폭이 이와 다르면 피치 각도가 틀린 것 (각도를 고쳐 다시 계산)
    # 보정 영상의 소실점 x 가 중앙보다 40px 오른쪽 = 로봇이 차선과 약 4° 틀어져 있었음 (BEV 에서 차선이 살짝 기울어 보임)
    # 아랫변이 화면보다 넓어(0~1 밖) BEV 아래 양 모서리는 검게 나온다
    # 바꾸면 map_planner.yaml 의 같은 값도 같이 고칠 것
    src_top_y: 0.266
    src_top_left_x: 0.264
    src_top_right_x: 0.736
    src_bottom_y: 1.0
    src_bottom_left_x: -0.061
    src_bottom_right_x: 1.061
    bev_width: 400           # 출력 크기 [px]
    bev_height: 400
    draw_grid: true          # GUI용 압축 영상에만 격자 표시
    jpeg_quality: 70
