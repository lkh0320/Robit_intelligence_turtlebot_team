bird_eye_view:
  ros__parameters:
    image_topic: image_raw
    # 원본에서 펼 사다리꼴 네 점 (이미지 폭/높이 비율, 0~1 밖도 가능)
    # 보정: 직선 차선 위에서 BEV 의 두 차선이 격자 세로선과 평행해질 때까지 조절
    # 2026-10-09 카메라 재설치 때 실측: 렌즈 높이 24cm, 수평 기준 45° 아래, 바퀴 축 -> 렌즈 9cm
    #   640x480 직선 차선의 소실점 (360, -129), 주점 (320, 240) 가정 -> 초점거리 f = (240 + 129) / tan45° = 369px
    # 2026-10-13 카메라 각도 수정 후 재보정 (같은 카메라라 f = 369 그대로):
    #   직선 차선 소실점 (333, -40): 노란 선 x = -0.480y + 313.0, 흰 선 x = 0.466y + 352.2 (빨간 정지선 행 제외)
    #   -> 피치 = atan((240 + 40) / 369) = 37.2° 아래. 렌즈 높이는 차선 폭이 예전과 같은 295px 가 되게 24.75cm
    #   (각도를 바꾸며 렌즈가 살짝 올라간 것으로 봄 -> 차선 폭 295px (parking.yaml lane_width_px) 그대로 씀)
    # 이 카메라 모델로 바닥의 직사각형을 원본에 투영해 사다리꼴을 계산했다 -> BEV 는 가로·세로 모두 1px = 1mm
    #   로봇 정면 기준 좌우 ±20cm, 화면 맨 아래(렌즈 앞 8.9cm)부터 40cm 앞까지 = 바퀴 축 앞 17.9cm ~ 57.9cm
    #   사다리꼴은 화면 중앙(x=0.5) 기준 좌우 대칭 (로봇 정면 = BEV 세로선)
    # 보정 영상의 BEV 에서 두 차선 중심 간격 295~299px (위 -> 아래). 다르게 나오면 피치 각도가 틀린 것
    # 보정 영상의 소실점 x 가 중앙보다 13px 오른쪽 = 로봇이 차선과 약 2° 틀어져 있었음
    # 아랫변이 화면보다 넓어(0~1 밖) BEV 아래 양 모서리는 검게 나온다
    # 바꾸면 parking.yaml (robot_y_offset_px, lane_width_px) 도 확인. grid_drive 는 floor_obs.hpp 에 따로 보정한 값을 씀
    src_top_y: 0.360
    src_top_left_x: 0.286
    src_top_right_x: 0.714
    src_bottom_y: 1.0
    src_bottom_left_x: -0.023
    src_bottom_right_x: 1.023
    bev_width: 400           # 출력 크기 [px]
    bev_height: 400
    draw_grid: true          # GUI용 압축 영상에만 격자 표시
    jpeg_quality: 70
