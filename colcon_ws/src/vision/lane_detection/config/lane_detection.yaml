lane_detection:
  ros__parameters:
    image_topic: image_bev    # bird_eye_view 노드 출력
    # 1. 색 (OpenCV LAB: L 0~255, a/b 는 128 이 무채색). 2026-10-01 실측: 노란 선 b≈188, 흰 선 L≈230~250, 바닥 L≈85
    yellow_b_min: 150
    yellow_l_min: 80
    white_l_min: 190
    white_ab_dev: 15          # 흰 선은 a, b 가 128 ± 이 값 안
    yellow_search_max_ratio: 1.0  # 노란 선 시작점을 화면 왼쪽 이 비율 안에서만 찾음 (1.0 = 전체)
                                  # 주차 구역(양쪽 노란선)에서 오른쪽 노란선을 잡으면 0.6 정도로
    # 2~5. 차선 탐색
    lane_width_px: 295.0      # BEV 에서 두 차선 중심 사이 폭 (2026-10-09 bird_eye_view 보정 영상에서 잰 값, 1px = 1mm)
    bev_center_x: 0.5         # BEV 에서 로봇(카메라 중심)의 가로 위치 (bird_eye_view 보정값에서 계산)
    # offset / angle 을 BEV 맨 아래보다 이만큼 아래(로봇 쪽)에서 잰다 [px = mm]. 재는 곳이 멀면 코너 안쪽을 파고든다
    #   2026-10-13 카메라 각도를 올려 BEV 맨 아래가 바퀴 축 앞 14.1 -> 17.9cm 로 멀어진 뒤 코너에서 안쪽 바퀴가 선을 밟음
    #   -> 38 = 예전처럼 축 앞 14.1cm 에서 잼 (sliding 게인을 튜닝한 위치). 그래도 밟으면 늘리고 (최대 179 = 바퀴 축),
    #   코너에서 늦게 꺾여 바깥으로 밀리면 줄인다. ros2 param set 으로 주행 중 바로 바뀜
    eval_below_px: 38.0
    base_min_pixels: 30       # 시작점 열에 필요한 최소 픽셀 수
    n_windows: 10
    window_margin: 30         # 윈도우 반폭 / 직전 곡선 주변 탐색 폭 [px]
    window_min_pixels: 20     # 이보다 많으면 다음 윈도우 중심을 옮긴다
    min_lane_pixels: 150      # 곡선 맞춤에 필요한 최소 픽셀 수
    min_curve_span: 0.4       # 픽셀 세로 범위가 이 비율보다 짧으면 직선으로 맞춤
    width_tolerance: 0.35     # 차선 폭이 lane_width_px 에서 이 비율 넘게 다르면 픽셀이 적은 쪽을 버림
    # 6. 시간 필터
    smooth_alpha: 0.5         # 새 곡선 비중 (1 = 필터 없음)
    hold_frames: 5            # 놓쳐도 직전 곡선을 유지할 프레임 수
    # +. 교차로 T자 가로 선 -> cross_line (lane_follower 가 교차로 회전 시작 조건으로 씀). GUI 화면에 주황 선 + CROSS
    #   녹화 재생 (2026-10-13): T자 앞에서 차선 놓친 7번 모두 0.3초 전 ~ 직후 검출, 진입 곡선에서 놓친 경우는 검출 없음
    cross_enabled: true
    cross_min_length_px: 250  # 이보다 긴 직선만 (25cm, 곡선 차선 / 섬 끝 U 는 짧다)
    cross_max_angle_deg: 15.0 # 가로에서 이 각도 안. 35° 로 하면 커브의 비스듬한 차선이 많이 잡힘
    cross_hough_threshold: 80
    cross_max_gap_px: 20      # 흰 / 노란 이음매 빈틈 허용
    # GUI 화면: final (최종) / mask (색 마스크 + 윈도우)
    debug_view: final
    debug_jpeg_quality: 70
