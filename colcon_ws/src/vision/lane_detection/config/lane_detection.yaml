lane_detection:
  ros__parameters:
    image_topic: image_raw
    roi_top: 0.5             # 이 비율 아래쪽만 처리 [0~1]
    # 노란 선 = 왼쪽 차선 (OpenCV HSV: H 0~180)
    yellow_h_min: 15
    yellow_h_max: 40
    yellow_s_min: 60
    yellow_v_min: 100
    # 흰 선 = 오른쪽 차선, 정지선
    white_s_max: 50
    white_v_min: 200         # 바닥 반사광(V≈170)은 제외, 흰 선은 V≈250
    canny_low: 50
    canny_high: 150
    hough_threshold: 30
    hough_min_length: 20     # [px]
    hough_max_gap: 20        # [px]
    right_margin: 0.1        # 왼쪽(노란) 차선에서 이만큼(이미지 폭 비율) 오른쪽부터 흰 선 인정
    lane_min_angle: 20.0     # 수평에서 이 각도[deg] 이상이면 차선 후보
    stop_max_angle: 10.0     # 수평에서 이 각도[deg] 이하면 정지선 후보
    stop_min_length: 0.4     # 정지선 최소 길이 (이미지 폭 비율)
    lane_width: 0.6          # 한쪽 차선만 보일 때 가정할 차선 폭 (이미지 폭 비율)
    debug_jpeg_quality: 70
