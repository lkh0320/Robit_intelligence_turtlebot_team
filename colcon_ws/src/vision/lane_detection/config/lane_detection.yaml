lane_detection:
  ros__parameters:
    image_topic: image_bev    # bird_eye_view 노드 출력
    # 1. 색 (OpenCV LAB: L 0~255, a/b 는 128 이 무채색). 2026-10-01 실측: 노란 선 b≈188, 흰 선 L≈230~250, 바닥 L≈85
    yellow_b_min: 150
    yellow_l_min: 80
    white_l_min: 190
    white_ab_dev: 15          # 흰 선은 a, b 가 128 ± 이 값 안
    # 2~5. 차선 탐색
    lane_width_px: 267.0      # BEV 에서 두 차선 중심 사이 폭 (bird_eye_view 보정 시 차선 간격 = BEV 폭의 2/3)
    bev_center_x: 0.5         # BEV 에서 로봇(카메라 중심)의 가로 위치 (bird_eye_view 보정값에서 계산)
    base_min_pixels: 30       # 시작점 열에 필요한 최소 픽셀 수
    n_windows: 10
    window_margin: 30         # 윈도우 반폭 / 직전 곡선 주변 탐색 폭 [px]
    window_min_pixels: 20     # 이보다 많으면 다음 윈도우 중심을 옮긴다
    min_lane_pixels: 150      # 곡선 맞춤에 필요한 최소 픽셀 수
    min_curve_span: 0.4       # 픽셀 세로 범위가 이 비율보다 짧으면 직선으로 맞춤
    width_tolerance: 0.35     # 차선 폭이 lane_width_px 에서 이 비율 넘게 다르면 픽셀이 적은 쪽을 버림
    # 6. 시간 필터
    smooth_alpha: 0.5         # 새 곡선 비중 (1 = 필터 없음)
    hold_frames: 5            # 놓쳐도 직전 곡선을 유지할 프레임 수
    # GUI 화면: final (최종) / mask (색 마스크 + 윈도우)
    debug_view: final
    debug_jpeg_quality: 70
