map_planner:
  ros__parameters:
    image_topic: image_raw    # 원본 카메라 영상 (BEV 는 이 노드가 같은 변환으로 직접 만든다)
    # 1. 색 마스크 (OpenCV LAB: L 0~255, a/b 는 128 이 무채색) - path_planner.yaml 과 같게
    yellow_l_min: 80
    yellow_b_min: 150
    yellow_a_max: 135         # 노란 선 a≈126, 박스 a≈145
    white_l_min: 190
    white_ab_dev: 15
    # 박스 (어두운 적갈색): 2026-10-08 실측 L 20~47, a 143~147, b 136~140, b-a ≈ -7
    box_l_min: 10
    box_l_max: 110
    box_a_min: 137
    box_a_max: 165            # 빨간 정지선(L119 a170 b147)은 a 가 더 높아 빠진다
    box_b_min: 128
    box_b_max: 152
    box_min_b_minus_a: -15    # 박스 b-a ≈ -7, 빨간 정지선 b-a ≈ -23
    box_min_area: 300         # [BEV px] (원본 마스크는 raw_scale^2 배로 줄여 씀)
    line_gap_close_px: 31     # BEV 선 마스크 세로 불리기 (점선 빈틈 메우기)
    # 2. BEV 변환: bird_eye_view.yaml 과 반드시 같게 (바뀌면 둘 다 고칠 것)
    src_top_y: 0.266
    src_top_left_x: 0.264
    src_top_right_x: 0.736
    src_bottom_y: 1.0
    src_bottom_left_x: -0.061
    src_bottom_right_x: 1.061
    bev_width: 400
    bev_height: 400
    # 원본 영상 보충 범위: BEV 사다리꼴(좌우 약 ±20cm) 밖의 옆 / 먼 곳을 원본에서 바로 지도에 펼친다
    raw_max_range_px: 1000.0  # 바퀴 축에서 이 거리까지 [px ≈ mm]
    raw_max_lateral_px: 450.0 # 좌우 이 범위까지
    raw_scale: 0.5            # 원본 마스크는 절반 해상도로 (속도)
    # 3. 지도 (단위 BEV px ≈ 1mm)
    bev_center_x: 0.5         # 로봇 가로 위치 (BEV 폭 비율)
    # 바퀴 축이 BEV 맨 아래보다 뒤에 있는 거리. 2026-10-09 실측(렌즈 24cm, 45°, 축->렌즈 9cm)으로 계산: 축 앞 14.1cm
    robot_y_offset_px: 141.0
    cell_px: 4.0              # 지도 한 칸 (4mm)
    map_size_px: 2000.0       # 지도 한 변 (2m)
    map_recenter_px: 300.0    # 로봇이 지도 가운데에서 이만큼 벗어나면 지도를 정수 칸만큼 옮김
    memory_px: 700.0          # BEV 로 본 칸은 70cm 달릴 동안 기억 (안 보이는 구간 14cm 보다 커야 함)
    raw_memory_px: 100.0      # 원본으로만 본 칸 (옆 / 먼 곳) 은 10cm 만 (이동량 오차로 이중선 생기는 것 방지)
    view_half_width_px: 600.0 # GUI 화면 범위
    view_front_px: 750.0
    view_back_px: 200.0
    # 4. 후보 경로: 바퀴 축에서 출발하는 곡선 k(t) = k0 + dk t (0 근처를 촘촘하게)
    n_paths: 21
    max_curvature: 0.00667    # [1/px] (반지름 15cm)
    n_curv_rates: 9
    max_curvature_rate: 0.0000444   # [1/px^2]
    path_length_px: 500.0
    sample_step_px: 5.0
    min_known_ratio: 0.15     # 본 적 있는 칸이 이보다 적은 경로는 탈락
    # 5. 점수
    robot_half_width_px: 102.5   # 로봇 반폭 (2026-10-08 실측 폭 20.5cm, 1px = 1mm)
    clearance_cap_px: 148.0   # 선이 한쪽만 보일 때 그 선에서 이 거리(반 차선 폭)를 따라감
    max_lane_width_px: 600.0  # 양쪽 선을 찾는 범위 (양쪽 다 보이면 그 가운데)
    line_weight: 10.0         # 선에 닿는 경로 벌점
    clearance_weight: 1.0     # 차선 가운데일수록 가점
    align_weight: 1.0         # 선과 나란하지 않은 경로 벌점
    box_margin_px: 80.0       # 박스까지 반폭 + 이 거리 안이면 벌점 (일찍 비켜 가게)
    box_weight: 3.0
    smooth_weight: 0.5        # 직전 경로와 다를수록 벌점
    straight_weight: 0.1      # 급커브 벌점
    fork_weight: 2.0          # 갈림길 표지판 방향 가점 (곡률 방향). 차선이 넓어지면 표지판 쪽 선을 따라가는 것도 같이 켜진다
    psd_weight: 2.0           # 가까운 PSD 쪽으로 도는 경로 벌점
    # 차선 규칙 (공사 구간에서는 노드가 끈다). 교차로에서 끊긴 틈으로 옆 길 / 건너편 차선에 끌려가지 않게
    #   - 색 순서: 노란 선 = 왼쪽, 흰 선 = 오른쪽 (주차 구간은 양쪽 흰색이라 왼쪽 흰 선은 허용).
    #     오른쪽 첫 선이 노란색이거나, 왼쪽 첫 선이 흰색인데 그 너머 노란 선이면 선을 넘은 자리 -> 벌점
    #   - 차선 폭: lane_width_px 보다 먼 선은 기준으로 안 씀. 양쪽 선 간격이 너무 넓으면 한쪽 선을 따라감
    #   - 빈틈 메우기: 지금 차선의 선이 끊겼다가 같은 색으로 다시 이어지면 그 사이를 가상 선으로 이음
    #     (GUI 지도에 주황 선. 갈림길 표지판이 가리키는 쪽은 안 메움)
    lane_rules: true          # false = 예전 방식 (비교 시험용)
    lane_width_tolerance: 0.35   # 양쪽 선 간격이 차선 폭 x 1.35 보다 넓으면 한 차선이 아님
    side_weight: 5.0          # 색 순서가 틀린 샘플 비율 x 이 값 = 벌점
    # true: 왼쪽 첫 선이 흰색이면 무조건 틀린 자리 (흰 선 = 오른쪽, 노란 선 = 왼쪽).
    #   2026-10-12 실주행: 좌회전 중 바깥 흰 선을 넘어 직진하는 경로가 이겼는데, 예전 규칙(흰 선 너머 노란 선이
    #   보일 때만 틀림)으로는 못 걸렀다. 주차 표지판을 본 뒤 parking_relax_px 동안은 노드가 끈다 (양쪽 흰 선)
    strict_colors: true
    # 복귀: 로봇이 노란 선 왼쪽(트랙 밖 / 코너를 잘라 넘음)에 있으면 그 노란 선은 넘어도 벌점 없음 (GUI 에 RECOVER).
    #   2026-10-12 시험: 노란 선 왼쪽에서 색 규칙 벌점을 받으면서도 노란 선을 다시 넘는 벌점이 더 커서 트랙 밖으로 감
    #   복귀 중에는 노란 선을 넘어 recover_inlane_px 넘게 차선 안을 지나지 않는 경로에 side_weight 벌점
    recover_wrong_side: true
    recover_inlane_px: 75.0
    # 선 넘기: 경로 중심이 선 위를 지나가면 벌점 (line_weight 는 선 근처 비율이라 스치는 것과 넘는 것을 구분 못 함)
    cross_line_px: 8.0
    cross_weight: 5.0
    gap_fill_px: 600.0        # 이 길이(60cm)까지의 빈틈을 메움 (0 = 끔)
    # 6. 출력
    lane_width_px: 295.0      # offset 정규화 (반 차선 폭 = 1). BEV 에서 두 차선 중심 간격 (bird_eye_view 보정값)
    lookahead_px: 200.0       # 바퀴 축에서 목표점까지 [px] (시뮬레이션에서 250 보다 커브 안쪽으로 덜 붙음)
    follower_lookahead_px: 250.0   # lane_follower pp_lookahead (0.25m) 와 같게: angle 을 이 기준으로 환산
    smooth_alpha: 0.6         # 고른 곡률의 새 값 비중 (1 = 필터 없음)
    hold_frames: 5            # 경로를 못 골라도 직전 값을 유지할 프레임 수
    min_wall_pixels: 200      # 선 + 박스 픽셀이 이보다 적으면 detected = false
    # 바퀴 속도 -> 이동량
    bev_px_per_m: 1000.0      # BEV 축척 (1px = 1mm, bird_eye_view 보정)
    wheel_separation: 0.190   # stm_bridge.yaml 과 같게 [m] (19cm 실측)
    dxl_timeout_sec: 0.5
    # 표지판 / PSD (path_planner 와 같음)
    sign_min_confidence: 0.5
    sign_min_area_ratio: 0.01
    construction_line_weight: 1.0
    construction_exit_sec: 3.0
    construction_timeout_sec: 30.0
    # 갈림길 표지판: 같은 방향이 fork_confirm_count 번 연달아 보이면 확정 (좌/우 표지판이 같이 있으면 번갈아 읽힘),
    # 확정 뒤 fork_hold_px 를 달릴 때까지 유지 (예전 3초는 0.04~0.1m/s 에서 12~30cm 라 갈림길 전에 풀렸다)
    fork_confirm_count: 3
    fork_hold_px: 1000.0
    fork_hold_sec: 20.0
    parking_relax_px: 3000.0  # 주차 표지판 후 이 거리 동안 왼쪽 흰 선 허용
    psd_side_threshold: 0.30
    psd_timeout_sec: 0.5
    # GUI 화면
    debug_scale: 2
    debug_candidates: true
    debug_jpeg_quality: 70
