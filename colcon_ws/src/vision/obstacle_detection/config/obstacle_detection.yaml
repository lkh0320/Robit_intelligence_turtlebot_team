# 차단바
barrier_detection:
  ros__parameters:
    image_topic: image_raw
    # 빨간색 범위 (OpenCV HSV: H 0~180, 빨강은 0 근처와 180 근처)
    red_h_low_max: 10
    red_h_high_min: 170
    red_s_min: 100
    red_v_min: 70
    min_segment_area: 0.0005  # 줄무늬 조각 최소 면적 (이미지 면적 비율)
    min_elongation: 1.5       # 조각 긴 변 / 짧은 변
    min_segments: 2           # 이 개수 이상이면 차단바로 판단
    closed_max_angle: 30.0    # 수평에서 이 각도[deg] 이하면 CLOSED
    debug_jpeg_quality: 70

# 벽 (좌우 번갈아 놓인 갈색 박스, 지그재그 회피 구간)
wall_detection:
  ros__parameters:
    image_topic: image_raw
    roi_top: 0.3              # 이 비율 아래쪽만 처리 (먼 배경 제외)
    # 갈색 범위 (OpenCV HSV: H 0~180). 노란 차선은 더 밝아서 v_max 로 걸러진다.
    brown_h_min: 5
    brown_h_max: 25
    brown_s_min: 70
    brown_v_min: 30
    brown_v_max: 200
    min_area: 0.01            # 벽 최소 면적 (이미지 면적 비율)
    debug_jpeg_quality: 70
