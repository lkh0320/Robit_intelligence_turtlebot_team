path_planner:
  ros__parameters:
    image_topic: image_bev    # bird_eye_view 노드 출력
    # 1. 막힌 곳 지도 (OpenCV LAB: L 0~255, a/b 는 128 이 무채색)
    #    선 색은 lane_detection.yaml 과 같게 (2026-10-01 실측: 노란 선 b≈188, 흰 선 L≈230~250, 바닥 L≈85)
    yellow_l_min: 80
    yellow_b_min: 150
    yellow_a_max: 135         # 노란 선 a≈126, 갈색 박스 a≈145. 이보다 붉으면 박스로 본다
    white_l_min: 190
    white_ab_dev: 15
    # 박스 (어두운 적갈색): 2026-10-08 실측 L 20~47, a 143~147, b 136~140, b-a ≈ -7 (바닥 L45 a127 b128)
    box_l_min: 10
    box_l_max: 110
    box_a_min: 137
    box_a_max: 165            # 빨간 정지선(2026-10-08 실측 L119 a170 b147)은 a 가 더 높아 빠진다
    box_b_min: 128
    box_b_max: 152
    box_min_b_minus_a: -15    # 박스 b-a ≈ -7, 빨간 정지선 b-a ≈ -23
    box_min_area: 300         # 이보다 작은 갈색 덩어리는 잡음 [px]
    line_gap_close_px: 31     # 선 마스크를 세로로 불리는 높이 (점선 빈틈 메우기) [px]
    # 2. 후보 경로
    bev_center_x: 0.5         # 로봇 가로 위치 (폭 비율, lane_detection 과 같게)
    # 바퀴 축이 BEV 맨 아래보다 뒤에 있는 거리 [px]. 2026-10-13 재보정(렌즈 높이 24.75cm, 수평 기준 37.2° 아래,
    # 축->렌즈 9cm)으로 계산: 화면 맨 아래 = 렌즈 앞 8.9cm = 축 앞 17.9cm (bird_eye_view.yaml 참고)
    robot_y_offset_px: 179.0
    n_paths: 21
    max_curvature: 0.00667    # 가장 급한 후보 곡률 [1/px] (반지름 150px)
    # 후보는 곡률이 거리에 따라 변하는 곡선 k0 + dk t: 시작 곡률 n_paths 개 x 변화율 n_curv_rates 개
    n_curv_rates: 1           # 1 = 원호 후보만 (주행 시험한 방식)
    n_hidden: 0               # 0 = 지난 경로 기억 + 바퀴 이동량 (실험: > 0 이면 바퀴 축에서 3차 곡선으로 다시 계획)
    max_curvature_rate: 0.0000444   # [1/px^2] (150px 동안 max_curvature 만큼 변함)
    path_length_px: 300.0
    sample_step_px: 5.0
    # 3. 점수
    robot_half_width_px: 102.5  # 로봇 반폭 [BEV px] (2026-10-08 실측 폭 20.5cm -> 10.25cm, 1px = 1mm)
    line_soft_px: 0.0         # > 0 이면 반폭 + 이 거리 안부터 가까울수록 선 벌점 (시뮬레이션에서 20 은 커브에서 더 나빴음)
    clearance_cap_px: 148.0   # 벽까지 이 거리 이상이면 만점 (차선 폭 / 2)
    line_weight: 10.0         # 선에 가까운 경로 벌점
    clearance_weight: 1.0     # 공간 가운데일수록 가점
    smooth_weight: 0.5        # 직전 경로와 다를수록 벌점
    straight_weight: 0.1      # 급커브 벌점
    fork_weight: 1.0          # 갈림길 표지판 방향 가점
    psd_weight: 2.0           # 가까운 PSD 쪽으로 도는 경로 벌점
    # 4. 출력 (offset/angle 은 경로 위 lookahead_px 앞 목표점 기준 -> lane_detection 과 크기가 다르니 PID 게인 재조정)
    lane_width_px: 295.0      # offset 정규화 (반 차선 폭 = 1). BEV 에서 두 차선 중심 간격 (bird_eye_view 보정값)
    # lane_follower.yaml path.pp_lookahead (0.20m) 와 같게. sliding 실주행 튜닝(코너 조기 진입 억제)에 맞춰 250 -> 200
    #   (BEV 맨 아래가 축 앞 179px 이라 목표점은 보이는 구간 안 21px 지점, 2026-10-13 재보정 뒤)
    lookahead_px: 200.0       # 바퀴 축에서 목표점까지 [px] (≈ 20cm)
    smooth_alpha: 0.6         # 고른 곡률의 새 값 비중 (1 = 필터 없음)
    hold_frames: 5            # 경로를 못 골라도 직전 값을 유지할 프레임 수
    min_wall_pixels: 200      # 선 + 박스 픽셀이 이보다 적으면 detected = false
    # 바퀴 속도 -> BEV 이동량 (안 보이는 구간 경로 기억)
    bev_px_per_m: 1000.0      # BEV 축척 (1px = 1mm, 가로·세로 같음. bird_eye_view 보정)
    wheel_separation: 0.190   # stm_bridge.yaml 과 같게 [m] (19cm 실측)
    # 표지판 / PSD
    sign_min_confidence: 0.5
    sign_min_area_ratio: 0.01
    construction_line_weight: 1.0   # 공사 구간에서는 선 넘기 허용
    construction_exit_sec: 3.0      # 박스를 본 뒤 이 시간 동안 안 보이면 공사 구간 종료
    construction_timeout_sec: 30.0
    fork_hold_sec: 3.0              # 갈림길 표지판을 본 뒤 방향 가점 유지 시간
    # lane_method:=hybrid: 공사 구간 / 갈림길을 sign 대신 lane_follower 의 drive_hint 로 정한다 (launch 가 켬)
    use_drive_hint: false
    drive_hint_timeout_sec: 0.5     # drive_hint 가 이보다 오래 끊기면 sign 으로 판단
    psd_side_threshold: 0.30        # [m]
    psd_timeout_sec: 0.5
    # GUI 화면: final (경로) / mask (막힌 곳 지도)
    debug_view: final
    debug_jpeg_quality: 70
