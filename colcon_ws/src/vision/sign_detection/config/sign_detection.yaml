sign_detection:
  ros__parameters:
    image_topic: image_raw
    # 파란색 범위 (OpenCV HSV: H 0~180)
    blue_h_min: 100
    blue_h_max: 130
    blue_s_min: 100
    blue_v_min: 50
    # 표지판 안 화살표(흰색) 범위
    white_s_max: 60
    white_v_min: 170
    min_area: 0.002           # 최소 면적 (이미지 면적 비율)
    min_circularity: 0.6      # 4πA/P² (원 = 1)
    direction_threshold: 0.05 # 화살표 무게중심 치우침 / 표지판 폭
    debug_jpeg_quality: 70
