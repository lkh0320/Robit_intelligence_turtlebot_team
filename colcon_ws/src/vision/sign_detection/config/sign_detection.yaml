sign_detection:
  ros__parameters:
    image_topic: image_raw
    # 노트북에서 export 한 ONNX (git 에 올리지 않음). ~ 는 노드가 홈 디렉터리로 바꾼다
    #   yolo export model=best.pt format=onnx imgsz=640 opset=12 simplify=True
    # 2026-10-14: v2 (v2_noflip best.pt) 를 imgsz=416 으로 다시 export (노트북 ~/yolo_export_20261014).
    #   640 (~/models/v2.onnx) 보다 추론 약 3배 빠르고 녹화 재생에서 같은 표지판을 잡음. 되돌리려면 둘 다 바꾼다
    model_path: ~/models/v2_416.onnx
    input_size: 416           # export 때 imgsz 와 같아야 한다
    # TensorRT 엔진 (젯슨 GPU). 있으면 이걸로 추론하고 model_path 는 안 읽는다. 없거나 못 읽으면 model_path 를 CPU 로.
    # 엔진은 기기 + TensorRT 버전에 묶여 있어 젯슨에서 만든다 (약 7분, JetPack 다시 깔거나 모델 바꾸면 다시):
    #   trtexec --onnx=$HOME/models/v2_416.onnx --saveEngine=$HOME/models/trt/v2_416_fp16.engine --fp16 --memPoolSize=workspace:512
    # 2026-10-27: 추론 3.3ms (CPU 68ms). "" 이면 CPU
    engine_path: ~/models/trt/v2_416_fp16.engine
    process_rate: 10.0        # [Hz] 처리 횟수 제한 (0 = 할 수 있는 만큼). lane_follower sign_confirm_window 가 이 속도 기준.
                              #   2026-10-14 녹화 재생 (BEV+lane+wall+sign+원본 녹화): 416 10Hz 에서 CPU 여유 36%
                              #   (예전 640 약 5Hz 33%), lane_info 30Hz 유지. 5Hz 면 여유 53%
    num_threads: 0            # OpenCV 스레드 수 (0 = 코어 전부). 3 이면 여유 40%, 추론 95ms
    conf_threshold: 0.5       # 이보다 낮은 박스는 버림
    nms_threshold: 0.45       # 같은 클래스 박스가 이 IoU 넘게 겹치면 하나만 남김
    debug_jpeg_quality: 70
